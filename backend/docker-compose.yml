version: '3.8'

# NOTE: Postgres is provided by the existing 'raisn-postgres' container on port 5432.
# This compose file only manages Redis for SMISSI.

services:
  redis:
    image: redis:7-alpine
    container_name: smissi_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
